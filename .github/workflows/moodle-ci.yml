##############################################################################
# GitHub Actions CI – local_instantcoursecompletion
#
# Triggered on push / PR to any branch EXCEPT main (dev workflow).
#
# Matrix: Moodle 4.5 · 5.0  ×  PHP 8.1 · 8.2 · 8.3  ×  mariadb · pgsql
#
# The plugin has NO external plugin dependencies. Integration with local_adele
# is optional and detected at runtime, so nothing extra is installed here.
##############################################################################

name: Moodle Plugin CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches-ignore:
      - main

env:
  MOODLE_CI: '^4'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PGPASSWORD: moodle

jobs:

  # ── 1a. PHP Lint ────────────────────────────────────────────────────────
  lint-php:
    name: "PHP Lint – ${{ matrix.php }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: PHP CodeSniffer (Moodle coding standard)
        run: moodle-plugin-ci phpcs plugin --max-warnings 0

      - name: PHP Mess Detector
        run: moodle-plugin-ci phpmd plugin || true

  # ── 1b. JS / Mustache / PHPDoc Lint ─────────────────────────────────────
  lint-js:
    name: "JS / Mustache / PHPDoc Lint"
    runs-on: ubuntu-24.04

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Install Moodle 4.5 baseline (no test init)
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --branch MOODLE_405_STABLE \
            --db-type mariadb \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-user root \
            --db-pass root \
            --db-name moodle \
            --no-init
        env:
          DB: mariadb
          MOODLE_BRANCH: MOODLE_405_STABLE

      - name: Install Node dependencies
        run: npm install
        working-directory: ${{ github.workspace }}/moodle

      - name: Grunt – AMD / ESLint / Stylelint
        run: moodle-plugin-ci grunt --max-lint-warnings 0
        continue-on-error: true

      - name: PHPDoc check
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Mustache lint
        run: moodle-plugin-ci mustache

      - name: Validate plugin structure
        run: moodle-plugin-ci validate

  # ── 2. PHPUnit ───────────────────────────────────────────────────────────
  phpunit:
    name: "PHPUnit (${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.db.engine }})"
    runs-on: ubuntu-24.04
    needs: [lint-php]
    strategy:
      fail-fast: false
      matrix:
        moodle: [MOODLE_405_STABLE, MOODLE_500_STABLE]
        php: ['8.1', '8.2', '8.3']
        db:
          - { engine: mariadb, type: mariadb, port: 3306, user: root,   pass: root   }
          - { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle }
        exclude:
          # Moodle 5.0 requires PHP 8.2+.
          - { moodle: MOODLE_500_STABLE, php: '8.1' }

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-retries=10
      pgsql:
        image: postgres:16
        env:
          POSTGRES_USER:     moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB:       postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U moodle"
          --health-interval=10s --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, pdo_pgsql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Install Moodle and plugin (no test init)
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --db-host 127.0.0.1 \
            --db-port ${{ matrix.db.port }} \
            --db-user ${{ matrix.db.user }} \
            --db-pass ${{ matrix.db.pass }} \
            --db-name moodle \
            --no-init
        env:
          DB: ${{ matrix.db.type }}
          MOODLE_BRANCH: ${{ matrix.moodle }}

      - name: Initialise PHPUnit environment
        run: cd moodle && php admin/tool/phpunit/cli/init.php

      - name: PHPUnit – all tests
        run: moodle-plugin-ci phpunit --fail-on-warning

  # ── 3. Behat ─────────────────────────────────────────────────────────────
  behat:
    name: "Behat (${{ matrix.moodle }} / PHP 8.2 / Chrome)"
    runs-on: ubuntu-24.04
    needs: [lint-php, lint-js]
    strategy:
      fail-fast: false
      matrix:
        moodle: [MOODLE_405_STABLE, MOODLE_500_STABLE]

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Install Moodle and plugin (no test init)
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --branch ${{ matrix.moodle }} \
            --db-type mariadb \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-user root \
            --db-pass root \
            --db-name moodle \
            --no-init
        env:
          DB: mariadb
          MOODLE_BRANCH: ${{ matrix.moodle }}

      - name: Initialise Behat environment
        run: cd moodle && php admin/tool/behat/cli/init.php

      - name: Behat – plugin scenarios
        run: |
          moodle-plugin-ci behat \
            --profile chrome \
            --tags "@local_instantcoursecompletion&&~@broken" \
            --start-servers

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behat-screenshots-${{ matrix.moodle }}
          path: ${{ github.workspace }}/moodle/behatfaildumps/
          retention-days: 7

  # ── Gate ─────────────────────────────────────────────────────────────────
  ci-complete:
    name: CI complete
    needs: [phpunit, behat]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: All matrix jobs must have succeeded
        run: |
          result="${{ needs.phpunit.result }}-${{ needs.behat.result }}"
          if [[ "$result" == "success-success" ]]; then
            echo "All CI jobs passed."
          else
            echo "CI result: $result – one or more jobs failed or were cancelled."
            exit 1
          fi
