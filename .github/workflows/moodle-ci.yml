##############################################################################
# GitHub Actions CI – local_instantcoursecompletion
#
# Triggered on push / PR to any branch EXCEPT main (dev workflow).
#
# Progressive PHP × DB matrix (Session 003):
#   Moodle 4.5  PHP 8.2 + 8.3  ×  MariaDB 10.11 + PostgreSQL 15  (classic)
#   Moodle 5.0  PHP 8.3 + 8.4  ×  MariaDB 10.11 + PostgreSQL 15  (classic)
#   Moodle 5.1  PHP 8.3 + 8.4  ×  MariaDB 11.4  + PostgreSQL 17  (modern)
#   Moodle 5.2  PHP 8.4 + 8.5  ×  MariaDB 11.4  + PostgreSQL 17  (modern)
#
# Behat: Selenium is started as a GHA service (pre-pulled, no runtime docker
# pull). The PHP built-in web server is started manually before Behat init.
# --start-servers is therefore NOT used in the behat command.
#
# The plugin has NO external plugin dependencies. Integration with local_adele
# is optional and detected at runtime, so nothing extra is installed here.
##############################################################################

name: Moodle Plugin CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches-ignore:
      - main

env:
  MOODLE_CI: '^4'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PGPASSWORD: moodle

jobs:

  # ── 1a. PHP Lint ────────────────────────────────────────────────────────
  lint-php:
    name: "PHP Lint – ${{ matrix.php }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: PHP CodeSniffer (Moodle coding standard)
        run: moodle-plugin-ci phpcs plugin --max-warnings 0

      - name: PHP Mess Detector
        run: moodle-plugin-ci phpmd plugin || true

  # ── 1b. JS / Mustache / PHPDoc Lint ─────────────────────────────────────
  lint-js:
    name: "JS / Mustache / PHPDoc Lint"
    runs-on: ubuntu-24.04

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Install Moodle 4.5 baseline (no test init)
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --branch MOODLE_405_STABLE \
            --db-type mariadb \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-user root \
            --db-pass root \
            --db-name moodle \
            --no-init
        env:
          DB: mariadb
          MOODLE_BRANCH: MOODLE_405_STABLE

      - name: Install Node dependencies
        run: npm install
        working-directory: ${{ github.workspace }}/moodle

      - name: Grunt – AMD / ESLint / Stylelint
        run: moodle-plugin-ci grunt --max-lint-warnings 0
        continue-on-error: true

      - name: PHPDoc check
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Mustache lint
        run: moodle-plugin-ci mustache

      - name: Validate plugin structure
        run: moodle-plugin-ci validate

  # ── 2. PHPUnit ───────────────────────────────────────────────────────────
  #
  # DB tiers (both MariaDB and PostgreSQL services are always started;
  # only the engine matching matrix.db.type is used for the test run):
  #   classic: MariaDB 10.11 + PostgreSQL 15  (Moodle 4.5, 5.0)
  #   modern:  MariaDB 11.4  + PostgreSQL 17  (Moodle 5.1, 5.2)
  #
  # Services use matrix expressions for the image tag — GitHub Actions
  # evaluates these per job instance before starting the containers.
  phpunit:
    name: "PHPUnit (${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.db.engine }} [${{ matrix.db.tier }}])"
    runs-on: ubuntu-24.04
    needs: [lint-php]
    strategy:
      fail-fast: false
      matrix:
        moodle:
          - MOODLE_405_STABLE
          - MOODLE_500_STABLE
          - MOODLE_501_STABLE
          - MOODLE_502_STABLE
        php: ['8.2', '8.3', '8.4', '8.5']
        db:
          - tier: classic
            engine: mariadb
            type: mariadb
            port: 3306
            user: root
            pass: root
            mariadb_image: 'mariadb:10.11'
            pgsql_image: 'postgres:15'
          - tier: classic
            engine: pgsql
            type: pgsql
            port: 5432
            user: moodle
            pass: moodle
            mariadb_image: 'mariadb:10.11'
            pgsql_image: 'postgres:15'
          - tier: modern
            engine: mariadb
            type: mariadb
            port: 3306
            user: root
            pass: root
            mariadb_image: 'mariadb:11.4'
            pgsql_image: 'postgres:17'
          - tier: modern
            engine: pgsql
            type: pgsql
            port: 5432
            user: moodle
            pass: moodle
            mariadb_image: 'mariadb:11.4'
            pgsql_image: 'postgres:17'
        exclude:
          # PHP constraints per Moodle branch.
          - { moodle: MOODLE_405_STABLE, php: '8.4' }
          - { moodle: MOODLE_405_STABLE, php: '8.5' }
          - { moodle: MOODLE_500_STABLE, php: '8.2' }
          - { moodle: MOODLE_500_STABLE, php: '8.5' }
          - { moodle: MOODLE_501_STABLE, php: '8.2' }
          - { moodle: MOODLE_501_STABLE, php: '8.5' }
          - { moodle: MOODLE_502_STABLE, php: '8.2' }
          # PHP 8.5 excluded for 5.2: Moodle 5.2's composer.lock still pins
          # ezyang/htmlpurifier v4.18.0 and openspout v4.28.5, both capped at
          # PHP 8.4 — 8.5 is not yet installable regardless of our CI config.
          # Revisit once Moodle's own lock file catches up.
          - { moodle: MOODLE_502_STABLE, php: '8.5' }
          # DB tier constraints: classic for 4.5 + 5.0, modern for 5.1 + 5.2.
          - { moodle: MOODLE_501_STABLE, db: { tier: classic } }
          - { moodle: MOODLE_502_STABLE, db: { tier: classic } }
          - { moodle: MOODLE_405_STABLE, db: { tier: modern } }
          - { moodle: MOODLE_500_STABLE, db: { tier: modern } }

    services:
      mariadb:
        image: ${{ matrix.db.mariadb_image }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --su=mysql --connect --innodb_initialized"
          --health-interval=10s --health-retries=10
      pgsql:
        image: ${{ matrix.db.pgsql_image }}
        env:
          POSTGRES_USER:     moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB:       postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U moodle"
          --health-interval=10s --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, pdo_pgsql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Install Moodle and plugin (no test init)
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --db-host 127.0.0.1 \
            --db-port ${{ matrix.db.port }} \
            --db-user ${{ matrix.db.user }} \
            --db-pass ${{ matrix.db.pass }} \
            --db-name moodle \
            --no-init
        env:
          DB: ${{ matrix.db.type }}
          MOODLE_BRANCH: ${{ matrix.moodle }}

      - name: Initialise PHPUnit environment
        run: |
          # Moodle 5.x moved admin/ under public/; earlier versions keep it at the root.
          if [ -f moodle/public/admin/tool/phpunit/cli/init.php ]; then
            (cd moodle/public && php admin/tool/phpunit/cli/init.php)
          else
            (cd moodle && php admin/tool/phpunit/cli/init.php)
          fi

      - name: PHPUnit – all tests
        run: moodle-plugin-ci phpunit --fail-on-warning

  # ── 3. Behat ─────────────────────────────────────────────────────────────
  #
  # Selenium runs on the host network so that Chrome resolves localhost:8000
  # to the PHP built-in web server, and the image is pulled and health-checked
  # before the run (avoids the docker pull timeouts seen with --start-servers).
  # moodle-plugin-ci behat is therefore called WITHOUT --start-servers.
  behat:
    name: "Behat (${{ matrix.moodle }} / PHP ${{ matrix.php }} / Chrome)"
    runs-on: ubuntu-24.04
    needs: [lint-php, lint-js]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { moodle: MOODLE_405_STABLE, php: '8.2' }
          - { moodle: MOODLE_500_STABLE, php: '8.3' }
          - { moodle: MOODLE_501_STABLE, php: '8.3' }
          - { moodle: MOODLE_502_STABLE, php: '8.4' }

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --su=mysql --connect --innodb_initialized"
          --health-interval=10s --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Install Moodle and plugin (no test init)
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --branch ${{ matrix.moodle }} \
            --db-type mariadb \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-user root \
            --db-pass root \
            --db-name moodle \
            --no-init
        env:
          DB: mariadb
          MOODLE_BRANCH: ${{ matrix.moodle }}

      - name: Start Selenium on the host network
        run: |
          # Chrome must reach the site at the same address the PHP side uses.
          # A GHA service container sits on its own bridge network, where
          # localhost:8000 is the container itself, so host networking is required.
          docker pull selenium/standalone-chrome:latest
          docker run -d --name selenium \
            --network host \
            --shm-size=2g \
            selenium/standalone-chrome:latest
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:4444/status; then
              break
            fi
            sleep 2
          done
          curl -fsS -o /dev/null http://localhost:4444/status

      - name: Start PHP built-in web server
        run: |
          # Moodle 5.x serves from moodle/public/; earlier versions from moodle/.
          if [ -d "${{ github.workspace }}/moodle/public" ]; then
            php -S 0.0.0.0:8000 \
              -t "${{ github.workspace }}/moodle/public" \
              > /dev/null 2>&1 &
          else
            php -S 0.0.0.0:8000 \
              -t "${{ github.workspace }}/moodle" \
              > /dev/null 2>&1 &
          fi
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8000/; then
              break
            fi
            sleep 1
          done

      - name: Initialise Behat environment
        run: |
          # moodle-plugin-ci places admin/ under public/ for Moodle 5.x.
          if [ -f moodle/public/admin/tool/behat/cli/init.php ]; then
            (cd moodle/public && php admin/tool/behat/cli/init.php)
          elif [ -f moodle/admin/tool/behat/cli/init.php ]; then
            (cd moodle && php admin/tool/behat/cli/init.php)
          fi

      - name: Behat – plugin scenarios
        run: |
          moodle-plugin-ci behat \
            --profile chrome \
            --tags "@local_instantcoursecompletion&&~@broken"

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behat-screenshots-${{ matrix.moodle }}
          path: ${{ github.workspace }}/moodle/behatfaildumps/
          retention-days: 7

  # ── Gate ─────────────────────────────────────────────────────────────────
  ci-complete:
    name: CI complete
    needs: [phpunit, behat]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: All matrix jobs must have succeeded
        run: |
          result="${{ needs.phpunit.result }}-${{ needs.behat.result }}"
          if [[ "$result" == "success-success" ]]; then
            echo "All CI jobs passed."
          else
            echo "CI result: $result – one or more jobs failed or were cancelled."
            exit 1
          fi
